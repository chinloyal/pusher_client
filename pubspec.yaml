name: pusher_client
description: >-
  A Pusher Channels client for Flutter on Android, iOS, macOS and web. Wraps
  pusher-websocket-java, pusher-websocket-swift and pusher-js.
version: 3.0.1
homepage: https://github.com/chinloyal/pusher_client
repository: https://github.com/chinloyal/pusher_client
issue_tracker: https://github.com/chinloyal/pusher_client/issues
documentation: https://github.com/chinloyal/pusher_client/blob/master/README.md
topics:
  - pusher
  - websocket
  - realtime
  - channels

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  http: ^1.2.0
  meta: ^1.15.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.github.chinloyal.pusher_client
        pluginClass: PusherClientPlugin
      ios:
        pluginClass: PusherClientPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: PusherClientPlugin
        sharedDarwinSource: true
      web:
        pluginClass: PusherClientWeb
        fileName: src/web/pusher_client_web.dart
