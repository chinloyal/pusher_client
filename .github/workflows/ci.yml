name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    name: Dart (analyze, unit tests, web tests, publish dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Web tests (Chrome)
        run: flutter test --platform chrome test/web
      - name: Publish dry run
        run: flutter pub publish --dry-run

  android:
    name: Android (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug
      - name: Android unit tests
        working-directory: example/android
        run: ./gradlew :pusher_client:testDebugUnitTest

  ios:
    name: iOS (build + XCTest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build example for the simulator
        working-directory: example
        run: flutter build ios --simulator --debug --no-codesign
      - name: Pick an iPhone simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in data[runtime]:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      print(d["name"])
                      sys.exit(0)
          sys.exit("no available iPhone simulator")
          ')
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: XCTest (RunnerTests)
        working-directory: example/ios
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO

  macos:
    name: macOS (build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build example
        working-directory: example
        run: flutter build macos --debug

  web:
    name: Web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build example
        working-directory: example
        run: flutter build web

  min-flutter:
    name: Minimum supported Flutter (3.27.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib
      - run: flutter test
